name: Update Schedule

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # 🚀 Включает кэширование для pip (библиотеки Python)
        
    - name: Cache Playwright browsers
      uses: actions/cache@v4 # 🚀 Кэширует сами браузеры Chromium
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}
        restore-keys: |
          playwright-browsers-
        
    - name: Install dependencies
      run: |
        pip install playwright beautifulsoup4 icalendar pytz requests
        playwright install chromium
        playwright install-deps chromium
        
    - name: Run parser
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python parser.py
      
    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add schedule.ics schedule.json debug.html
        
        if git diff --staged --quiet; then
          echo "Изменений нет."
        else
          git commit -m "chore: update schedule files"
          git push origin HEAD:$(git branch --show-current)
        fi
