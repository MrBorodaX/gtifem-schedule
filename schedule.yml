name: Update Schedule

on:
  schedule:
    - cron: '0 */2 * * *'  # Каждые 2 часа
  workflow_dispatch:       # Кнопка для ручного запуска

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install playwright beautifulsoup4 icalendar pytz requests
        playwright install chromium
        playwright install-deps chromium
    - name: Run parser
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python parser.py
    - name: Commit and push if changed
      run: |
        git config user.name "Schedule Bot"
        git config user.email "bot@github.com"
        git add schedule.ics
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update schedule" && git push)
